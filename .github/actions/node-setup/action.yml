name: Setup Node and pnpm Environment
description: Installs the requested Node version, configures pnpm, and sets up caching

inputs:
  node-version:
    description: The Node.js version to install
    required: false
    default: '24'

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      with:
        version: 9
        run_install: false

    - name: Set up Node.js ${{ inputs.node-version }}
      id: setup-node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Show cache status
      shell: bash
      env:
        CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
      run: |
        echo "Cache hit: $CACHE_HIT"
