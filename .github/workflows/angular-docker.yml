name: Docker Build and Push Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: >
          auth.docker.io:443
          ghcr.io:443
          github.com:443
          production.cloudfront.docker.com:443
          registry-1.docker.io:443
          release-assets.githubusercontent.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443
          fulcio.sigstore.dev:443
          rekor.sigstore.dev:443
          tuf-repo-cdn.sigstore.dev:443
      extra-docker-endpoints:
        description: Extra endpoints appended to allowed-endpoints (base list stays intact)
        required: false
        type: string
        default: ""
    secrets:
      CR_PAT:
        description: Optional PAT for pushing to GHCR
        required: false
    outputs:
      image-digest:
        description: >
          Full digest reference (name@sha256:...) of the pushed image, so callers
          can verify the exact artifact that was signed rather than a mutable tag.
          Empty on pull-request builds.
        value: ${{ jobs.docker-publish.outputs.image-digest }}

jobs:
  docker-publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-digest: ${{ steps.build-and-push.outputs.digest != '' && format('ghcr.io/{0}@{1}', github.repository, steps.build-and-push.outputs.digest) || '' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ inputs.extra-docker-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: dist
          path: dist/

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to Github Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT || github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker image
        id: build-and-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 30

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign published image (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }}
        run: |
          echo "Signing $IMAGE_DIGEST"
          cosign sign --yes "$IMAGE_DIGEST"

      - name: Attest SBOM to image (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            "$IMAGE_DIGEST"

      - name: GHCR Cleanup (With Auto-retry)
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/ghcr-cleanup
        with:
          image-name: ${{ github.event.repository.name }}
          pat-token: ${{ secrets.CR_PAT || github.token }}
