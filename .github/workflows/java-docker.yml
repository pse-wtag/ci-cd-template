name: Buildpack Build and Push Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: >
          auth.docker.io:443
          ghcr.io:443
          github.com:443
          production.cloudfront.docker.com:443
          registry-1.docker.io:443
          release-assets.githubusercontent.com:443
          repo.maven.apache.org:443
          repo1.maven.org:443
          api.github.com:443
          objects.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443
          fulcio.sigstore.dev:443
          rekor.sigstore.dev:443
          tuf-repo-cdn.sigstore.dev:443
          mirror.gcr.io:443
          github-releases.githubusercontent.com:443
          raw.githubusercontent.com:443
          toolbox-data.anchore.io:443
          timestamp.sigstore.dev:443
      extra-allowed-endpoints:
        description: Extra endpoints appended to allowed-endpoints (base list stays intact)
        required: false
        type: string
        default: ""
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"
      spring-boot-args:
        description: Extra arguments for the Spring Boot build command (e.g. profiles or modules)
        required: false
        type: string
        default: ""
    outputs:
      image-digest:
        description: >
          Full digest reference (name@sha256:...) of the pushed image, so callers
          can verify the exact artifact that was signed rather than a mutable tag.
          Empty on pull-request builds (nothing is pushed or signed).
        value: ${{ jobs.build-and-push.outputs.image-digest }}
    secrets:
      CR_PAT:
        description: >
          Optional PAT for pushing to and cleaning up GHCR. Falls back to the
          job's GITHUB_TOKEN when not provided.
        required: false

jobs:
  build-and-push:
    name: Buildpack Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-digest: ${{ steps.ref.outputs.digest }}
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ inputs.extra-allowed-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Java Environment
        uses: pse-wtag/java-ci-cd-template/.github/actions/java-setup@eab9ecc711576348dafed94089f0afffd2c89106
        with:
          java-version: ${{ inputs.java-version }}
          cache-type: ${{ inputs.cache-type }}

      - name: Login to Github Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT || github.token }}

      - name: Make Maven wrappers executable
        run: chmod +x mvnw

      - name: Build and Push (Maven)
        id: build
        env:
          REPO_NAME: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SHORT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REGISTRY_ACTOR: ${{ github.repository_owner }}
          REGISTRY_PASSWORD: ${{ secrets.CR_PAT || github.token }}
          SPRING_BOOT_ARGS: ${{ inputs.spring-boot-args }}
        run: |
          REPO_LC=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "$SHORT_SHA" | cut -c1-7)

          if [ "$EVENT_NAME" == "pull_request" ]; then
            TAG="pr-${PR_NUMBER}"
            PUBLISH=false
          else
            TAG="main-${SHORT_SHA}"
            PUBLISH="true"
          fi

          IMAGE_NAME="ghcr.io/${REPO_LC}:${TAG}"

          echo "Building image: $IMAGE_NAME"
          echo "Publishing to GHCR: $PUBLISH"

          # shellcheck disable=SC2086
          ./mvnw -B -ntp -T 1C package spring-boot:build-image $SPRING_BOOT_ARGS \
            -Dmaven.test.skip=true \
            -Denforcer.skip=true \
            -Dspotless.check.skip=true \
            -Djacoco.skip=true \
            -Dcheckstyle.skip=true \
            -Dspring-boot.build-image.imageName="$IMAGE_NAME" \
            -Dspring-boot.build-image.publish="$PUBLISH" \
            -Dspring-boot.build-image.docker.publishRegistry.url=https://ghcr.io \
            -Dspring-boot.build-image.docker.publishRegistry.username="$REGISTRY_ACTOR" \
            -Dspring-boot.build-image.docker.publishRegistry.password="$REGISTRY_PASSWORD"

          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Resolve image reference
        id: ref
        env:
          IMAGE_NAME: ${{ steps.build.outputs.image }}
          PUBLISH: ${{ steps.build.outputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ]; then
            # Pull-request build: nothing was pushed, so no registry digest exists.
            # Scan the locally built tag; no signing happens on this path.
            echo "ref=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME" 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not resolve pushed image digest for $IMAGE_NAME"
            exit 1
          fi
          echo "Resolved $IMAGE_NAME -> $DIGEST"
          echo "ref=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Resolve Trivy DB cache date
        id: trivy-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy vulnerability DB
        id: trivy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-db-

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.ref }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          cache-dir: ${{ github.workspace }}/.cache/trivy
          trivyignores: .trivyignore

      - name: Save Trivy vulnerability DB
        if: github.ref == 'refs/heads/main' && steps.trivy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ steps.trivy-date.outputs.date }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.ref.outputs.ref }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 30

      - name: Install Cosign
        if: steps.build.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign published image (keyless)
        if: steps.build.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.ref.outputs.digest }}
        run: |
          echo "Signing $IMAGE_DIGEST"
          cosign sign --yes "$IMAGE_DIGEST"

      - name: Attest SBOM to image (keyless)
        if: steps.build.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.ref.outputs.digest }}
        run: |
          # Bind the CycloneDX SBOM to the exact pushed digest as a signed,
          # in-toto attestation so consumers can verify provenance with
          # `cosign verify-attestation --type cyclonedx`.
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            "$IMAGE_DIGEST"

      - name: GHCR Cleanup (With Auto-retry)
        if: github.event_name != 'pull_request'
        uses: pse-wtag/java-ci-cd-template/.github/actions/ghcr-cleanup@eab9ecc711576348dafed94089f0afffd2c89106
        with:
          image-name: ${{ github.event.repository.name }}
          pat-token: ${{ secrets.CR_PAT || github.token }}
