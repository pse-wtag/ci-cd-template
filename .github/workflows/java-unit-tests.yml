name: Unit Test Module

on:
  workflow_call:
    inputs:
      egress-policy:
        description: Harden runner policy (audit or block)
        required: false
        type: string
        default: "block"
      allowed-endpoints:
        description: Allowed endpoints when policy is block
        required: false
        type: string
        default: >
          github.com:443
          repo.maven.apache.org:443
          repo1.maven.org:443
          api.github.com:443
          repo.spring.io:443
          repository.jboss.org:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          github-releases.githubusercontent.com:443
      extra-allowed-endpoints:
        description: Extra endpoints appended to allowed-endpoints (base list stays intact)
        required: false
        type: string
        default: ""
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ${{ inputs.allowed-endpoints }}
            ${{ inputs.extra-allowed-endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Java Environment
        uses: pse-wtag/java-ci-cd-template/.github/actions/java-setup@eab9ecc711576348dafed94089f0afffd2c89106
        with:
          java-version: ${{ inputs.java-version }}
          cache-type: ${{ inputs.cache-type }}

      - name: Make Maven wrappers executable
        run: chmod +x mvnw

      - name: Run Unit Test (Maven)
        run: ./mvnw -B -ntp -T 1C test --file pom.xml

      - name: Publish Unit Tests Report (Maven)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        continue-on-error: true
        with:
          name: Maven Unit Tests
          path: "**/target/*-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: 'false'
