name: Release

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "25"
      cache-type:
        required: false
        type: string
        default: "maven"
      egress-policy:
        required: false
        type: string
        default: "block"
      extra-docker-endpoints:
        description: Extra endpoints appended to the docker-publish and verify-image allowlists
        required: false
        type: string
        default: ""
      spring-boot-args:
        required: false
        type: string
        default: ""
      signer-identity-regexp:
        description: >
          Regexp the published image's keyless Cosign signature must match for
          verify-image to accept it. Empty defaults to a workflow file under the
          current repository owner. Pin it to the exact signing-workflow path for
          a tighter trust boundary, or set it when the signing reusable workflow
          lives in a different org than the consuming repo.
        required: false
        type: string
        default: ""
    secrets:
      CR_PAT:
        required: false

jobs:
  tag:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/tag.yml
    permissions:
      contents: write

  docker-publish:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/java-docker.yml
    secrets:
      CR_PAT: ${{ secrets.CR_PAT }}
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      java-version: ${{ inputs.java-version }}
      cache-type: ${{ inputs.cache-type }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-docker-endpoints }}
      spring-boot-args: ${{ inputs.spring-boot-args }}

  verify-image:
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: ${{ inputs.egress-policy }}
          disable-sudo: true
          allowed-endpoints: >
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            github.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            github-releases.githubusercontent.com:443
            ${{ inputs.extra-docker-endpoints }}

      - name: Login to Github Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT || github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Verify image signature (keyless)
        env:
          IMAGE_DIGEST: ${{ needs.docker-publish.outputs.image-digest }}
          OWNER: ${{ github.repository_owner }}
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
        run: |
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::docker-publish produced no image digest to verify"
            exit 1
          fi

          if [ -z "$IDENTITY_REGEXP" ]; then
            # Default: require a workflow file under the repo owner, not just any
            # identity. Set signer-identity-regexp to pin the exact signing workflow.
            IDENTITY_REGEXP="^https://github\.com/${OWNER}/[^/]+/\.github/workflows/"
          fi

          echo "Verifying signature for $IMAGE_DIGEST (identity ~ ${IDENTITY_REGEXP})"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_DIGEST"
